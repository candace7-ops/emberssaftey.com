<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EMBERS</title>

  <!-- Oswald font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="screen">
    <!-- Minimal top area (optional). Leave empty for ultra-minimal look. -->
    <header class="top">
      <div class="wordmark">
        <div class="name">EMBERS</div>
        <div class="acronym">EARLY MONITORING + BURN‑ENDURANCE RESPONSE SYSTEM</div>
      </div>
      <div class="status">
        <span class="pill">PATENT PENDING</span>
        <span class="dot"></span>
        <span class="tag">Wildland Firefighter Safety Armband — vibration‑first early warning (screenless, glove‑friendly)</span>
      </div>
    </header>

    <!-- Big empty tactical space -->
    <section class="void" aria-hidden="true"></section>

    <!-- Bottom lockup -->
    <footer class="bottom">
      <p class="one-line">
        EMBERS is a screenless, vibration‑first early warning armband for wildland firefighters.
      </p>

      <div class="brand-lockup">
        <img class="logo" src="./assets/embers-logo.png" alt="EMBERS logo">
        <!-- Optional flame. Delete this line if you don’t have it. -->
        <!-- <img class="flame" src="./assets/flame.png" alt="Flame mark"> -->
      </div>
    </footer>
  </main>
</body>
</html>
